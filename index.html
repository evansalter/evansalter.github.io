<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evan Salter</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      // Apply the saved wallpaper before first paint (see src/components/desktop/wallpaper.js)
      (function () {
        var wallpaper = 'clouds'
        try {
          if (localStorage.getItem('wallpaper') === 'none') wallpaper = 'none'
        } catch (e) {}
        document.documentElement.dataset.wallpaper = wallpaper
        // Start downloading the clouds now, instead of after the stylesheet
        // loads. (scripts/prerender.js strips this link from the static HTML.)
        if (wallpaper === 'clouds') {
          var link = document.createElement('link')
          link.id = 'wallpaper-preload'
          link.rel = 'preload'
          link.as = 'image'
          link.href = '/wallpaper/clouds.jpg'
          link.fetchPriority = 'high'
          document.head.appendChild(link)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script id="dsq-count-scr" src="https://evansalter.disqus.com/count.js" async></script>
  </body>
</html>
